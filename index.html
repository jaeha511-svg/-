<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D 방 꾸미기 (학생 맞춤형 크기 입력)</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none; /* 태블릿 터치 스크롤 방지 */
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      background: #f0f0f0;
    }
    /* 상단 메뉴바 */
    #ui-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }
    .input-group input {
      width: 65px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      touch-action: auto; /* 입력창 터치 허용 */
    }
    .input-group input[type="text"] {
      width: 90px;
    }
    .btn {
      padding: 8px 14px;
      border: none;
      background: #4A90E2;
      color: white;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn:active {
      background: #357ABD;
    }
    .btn-danger {
      background: #E74C3C;
    }
    .btn-danger:active {
      background: #C0392B;
    }
    /* 안내 문구 및 상태 표시 */
    #status-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
      z-index: 10;
      text-align: center;
    }
  </style>
  <!-- Three.js 및 컨트롤 라이브러리 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui-panel">
    <div class="input-group">
      이름: <input type="text" id="f-name" placeholder="예: 책상" value="가구1">
    </div>
    <div class="input-group">
      가로: <input type="number" id="f-width" placeholder="cm" value="120">cm
    </div>
    <div class="input-group">
      세로: <input type="number" id="f-depth" placeholder="cm" value="60">cm
    </div>
    <div class="input-group">
      높이: <input type="number" id="f-height" placeholder="cm" value="75">cm
    </div>
    <button class="btn" onclick="addCustomFurniture()">➕ 가구 추가</button>
    <button class="btn" onclick="rotateSelected()">🔄 90° 회전</button>
    <button class="btn btn-danger" onclick="deleteSelected()">🗑️ 삭제</button>
  </div>

  <div id="status-bar">💡 가구를 터치하여 선택 후 이동 및 삭제할 수 있습니다. (두 손가락: 화면 회전/확대)</div>
  <div id="canvas-container"></div>

  <script>
    // 1. Scene, Camera, Renderer 설정
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f5f7);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    // 3m x 3m 방에 맞추어 적절한 위치로 설정 (단위: 1m = 100cm)
    camera.position.set(0, 4.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 2. 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 3. OrbitControls (화면 회전/줌)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // 4. 방 공간 생성 (3m x 3m = 300cm x 300cm)
    // 1m = 1 단위로 계산 (3m x 3m)
    const ROOM_SIZE = 3.0; 
    const roomGroup = new THREE.Group();

    // 바닥 격자 (30cm 단위 그리드)
    const grid = new THREE.GridHelper(ROOM_SIZE, 10, 0x888888, 0xdddddd);
    grid.position.y = 0.001;
    roomGroup.add(grid);

    // 바닥
    const floorGeo = new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xeaeaea });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    roomGroup.add(floor);

    // 뒷벽 (위쪽 벽, Z = -1.5)
    const wallHeight = 2.4; // 방 높이 2.4m
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, side: THREE.DoubleSide });
    
    // 뒷벽 (문 표시를 위해 분할 생성)
    // 문 크기: 가로 0.9m (90cm), 높이 2.0m (200cm)
    const doorWidth = 0.9;
    const doorHeight = 2.0;
    const wallSideWidth = (ROOM_SIZE - doorWidth) / 2; // (3.0 - 0.9)/2 = 1.05m

    // 뒷벽 왼쪽 부분
    const wallBackLeft = new THREE.Mesh(new THREE.PlaneGeometry(wallSideWidth, wallHeight), wallMat);
    wallBackLeft.position.set(-ROOM_SIZE/2 + wallSideWidth/2, wallHeight/2, -ROOM_SIZE/2);
    roomGroup.add(wallBackLeft);

    // 뒷벽 오른쪽 부분
    const wallBackRight = new THREE.Mesh(new THREE.PlaneGeometry(wallSideWidth, wallHeight), wallMat);
    wallBackRight.position.set(ROOM_SIZE/2 - wallSideWidth/2, wallHeight/2, -ROOM_SIZE/2);
    roomGroup.add(wallBackRight);

    // 뒷벽 문 위쪽 부분
    const wallBackTop = new THREE.Mesh(new THREE.PlaneGeometry(doorWidth, wallHeight - doorHeight), wallMat);
    wallBackTop.position.set(0, doorHeight + (wallHeight - doorHeight)/2, -ROOM_SIZE/2);
    roomGroup.add(wallBackTop);

    // 🚪 문 모양 (가장 위쪽 벽 가운데)
    const doorFrameGeo = new THREE.PlaneGeometry(doorWidth, doorHeight);
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, side: THREE.DoubleSide }); // 우드톤 문
    const door = new THREE.Mesh(doorFrameGeo, doorMat);
    door.position.set(0, doorHeight / 2, -ROOM_SIZE / 2 + 0.005);
    roomGroup.add(door);

    // 문 손잡이
    const handleGeo = new THREE.SphereGeometry(0.04, 16, 16);
    const handleMat = new THREE.MeshStandardMaterial({ color: 0xFFD700 });
    const handle = new THREE.Mesh(handleGeo, handleMat);
    handle.position.set(0.35, 1.0, -ROOM_SIZE / 2 + 0.02);
    roomGroup.add(handle);

    // 왼쪽 벽
    const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, wallHeight), wallMat);
    wallLeft.position.set(-ROOM_SIZE/2, wallHeight/2, 0);
    wallLeft.rotation.y = Math.PI / 2;
    roomGroup.add(wallLeft);

    scene.add(roomGroup);

    // 5. 파스텔 톤 색상 리스트 (가구 생성 시 랜덤 부여)
    const colors = [0x4A90E2, 0x50E3C2, 0xF5A623, 0xB8E986, 0xBD10E0, 0x9013FE, 0xE67E22, 0x1ABC9C];
    let colorIndex = 0;

    // 6. 가구 생성 함수 (cm 단위 -> m 단위 변환)
    const furnitureList = [];
    let selectedObject = null;

    function addCustomFurniture() {
      const name = document.getElementById('f-name').value || '가구';
      const wCm = parseFloat(document.getElementById('f-width').value) || 100;
      const dCm = parseFloat(document.getElementById('f-depth').value) || 50;
      const hCm = parseFloat(document.getElementById('f-height').value) || 75;

      // cm -> m 변환
      const w = wCm / 100;
      const d = dCm / 100;
      const h = hCm / 100;

      const group = new THREE.Group();

      // 직육면체 메쉬 생성
      const geometry = new THREE.BoxGeometry(w, h, d);
      const material = new THREE.MeshStandardMaterial({
        color: colors[colorIndex % colors.length],
        roughness: 0.3
      });
      colorIndex++;

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = h / 2; // 바닥 위에 올림
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      // 텍스트 라벨 (가구 이름 및 치수 표기 Canvas Texture)
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 256, 128);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#333333';
      ctx.strokeRect(0, 0, 256, 128);
      ctx.fillStyle = '#000000';
      ctx.font = 'Bold 28px Noto Sans KR, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(name, 128, 50);
      ctx.font = '20px Noto Sans KR, sans-serif';
      ctx.fillText(`${wCm}x${dCm}x${hCm}cm`, 128, 90);

      const texture = new THREE.CanvasTexture(canvas);
      const labelMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      const labelGeo = new THREE.PlaneGeometry(Math.min(w, 1.2), Math.min(w, 1.2) * 0.5);
      const label = new THREE.Mesh(labelGeo, labelMat);
      label.position.set(0, h + 0.01, 0);
      label.rotation.x = -Math.PI / 2; // 상단에 텍스트 보이게
      group.add(label);

      // 데이터 저장 (원본 메쉬 색상 기억)
      group.userData = { 
        name: name,
        mesh: mesh,
        originalColor: material.color.getHex()
      };

      // 방 가운데 배치
      group.position.set(0, 0, 0);

      scene.add(group);
      furnitureList.push(group);
      selectObject(group);
    }

    // 7. 레이캐스팅 & 선택 / 이동 처리 (터치 및 마우스)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const planeIntersect = new THREE.Vector3();
    let isDragging = false;

    function getPointerPos(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (x / window.innerWidth) * 2 - 1,
        y: -(y / window.innerHeight) * 2 + 1
      };
    }

    function onPointerDown(e) {
      // 입력창 클릭 시 터치 이벤트 패스
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;

      if (e.touches && e.touches.length > 1) {
        isDragging = false;
        controls.enabled = true;
        return;
      }

      const pos = getPointerPos(e);
      mouse.x = pos.x;
      mouse.y = pos.y;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(furnitureList, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== scene) {
          obj = obj.parent;
        }
        selectObject(obj);
        isDragging = true;
        controls.enabled = false;
      } else {
        deselectObject();
      }
    }

    function onPointerMove(e) {
      if (!isDragging || !selectedObject) return;
      if (e.touches && e.touches.length > 1) return;

      const pos = getPointerPos(e);
      mouse.x = pos.x;
      mouse.y = pos.y;

      raycaster.setFromCamera(mouse, camera);
      if (raycaster.ray.intersectPlane(plane, planeIntersect)) {
        // 3m x 3m 방 내부 경계 처리 (-1.4m ~ 1.4m)
        const bound = ROOM_SIZE / 2 - 0.1;
        selectedObject.position.x = Math.max(-bound, Math.min(bound, planeIntersect.x));
        selectedObject.position.z = Math.max(-bound, Math.min(bound, planeIntersect.z));
      }
    }

    function onPointerUp() {
      isDragging = false;
      controls.enabled = true;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // 8. 가구 선택, 회전, 삭제 로직
    function selectObject(obj) {
      deselectObject();
      selectedObject = obj;
      if (selectedObject && selectedObject.userData.mesh) {
        // 선택 시 밝은 노란색으로 테두리/색상 하이라이트
        selectedObject.userData.mesh.material.color.setHex(0xFFD700);
        document.getElementById('status-bar').innerText = `선택됨: [${selectedObject.userData.name}] - 드래그하여 이동하거나 회전/삭제할 수 있습니다.`;
      }
    }

    function deselectObject() {
      if (selectedObject && selectedObject.userData.mesh) {
        selectedObject.userData.mesh.material.color.setHex(selectedObject.userData.originalColor);
        selectedObject = null;
        document.getElementById('status-bar').innerText = '💡 가구를 터치하여 선택 후 이동 및 삭제할 수 있습니다. (두 손가락: 화면 회전/확대)';
      }
    }

    function rotateSelected() {
      if (selectedObject) {
        selectedObject.rotation.y += Math.PI / 2;
      } else {
        alert('회전할 가구를 먼저 선택해 주세요.');
      }
    }

    // 🗑️ 수정된 삭제 함수 (즉시 삭제 및 메모리 정리)
    function deleteSelected() {
      if (selectedObject) {
        scene.remove(selectedObject);
        const index = furnitureList.indexOf(selectedObject);
        if (index > -1) {
          furnitureList.splice(index, 1);
        }
        
        // 메모리 해제
        selectedObject.traverse((child) => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose());
            } else {
              child.material.dispose();
            }
          }
        });

        selectedObject = null;
        document.getElementById('status-bar').innerText = '삭제되었습니다. 다른 가구를 추가하거나 선택하세요.';
      } else {
        alert('삭제할 가구를 먼저 선택해 주세요.');
      }
    }

    // 화면 크기 조절 대응
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 초기 가구 하나 생성
    addCustomFurniture();
  </script>
</body>
</html>
