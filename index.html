<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D 방 꾸미기 (방 크기 변경 & 메뉴 스크롤 지원)</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      background: #f0f0f0;
    }
    /* 📱 좌우 스크롤이 가능한 상단 메뉴바 */
    #ui-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      flex-wrap: nowrap; /* 줄바꿈 방지 및 한 줄 유지 */
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 10;
      overflow-x: auto; /* 좌우 스크롤 적용 */
      touch-action: pan-x; /* 메뉴바 내에서는 좌우 스크롤 터치 허용 */
      -webkit-overflow-scrolling: touch;
    }
    /* 스크롤바 모던 스타일링 */
    #ui-panel::-webkit-scrollbar {
      height: 4px;
    }
    #ui-panel::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }
    .panel-section {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0; /* 요소 크기 줄어듦 방지 */
    }
    .divider {
      width: 1px;
      height: 24px;
      background: #ddd;
      margin: 0 4px;
      flex-shrink: 0;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
    }
    .input-group input {
      width: 55px;
      padding: 6px 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      touch-action: auto;
    }
    .input-group input[type="text"] {
      width: 75px;
    }
    .btn {
      padding: 8px 12px;
      border: none;
      background: #4A90E2;
      color: white;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .btn:active {
      background: #357ABD;
    }
    .btn-room {
      background: #27ae60;
    }
    .btn-room:active {
      background: #1e8449;
    }
    .btn-danger {
      background: #E74C3C;
    }
    .btn-danger:active {
      background: #C0392B;
    }
    /* 안내 및 상태 바 */
    #status-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      white-space: nowrap;
    }
  </style>
  <!-- Three.js 및 OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui-panel">
    <!-- 1. 방 사이즈 조절 구역 -->
    <div class="panel-section">
      <div class="input-group" style="color: #27ae60;">
        🏠 방 가로: <input type="number" id="r-width" value="300">cm
      </div>
      <div class="input-group" style="color: #27ae60;">
        세로: <input type="number" id="r-depth" value="300">cm
      </div>
      <button class="btn btn-room" onclick="updateRoomSize()">방 크기 적용</button>
    </div>

    <div class="divider"></div>

    <!-- 2. 가구 생성 구역 -->
    <div class="panel-section">
      <div class="input-group">
        이름: <input type="text" id="f-name" value="가구1">
      </div>
      <div class="input-group">
        가로: <input type="number" id="f-width" value="120">cm
      </div>
      <div class="input-group">
        세로: <input type="number" id="f-depth" value="60">cm
      </div>
      <div class="input-group">
        높이: <input type="number" id="f-height" value="75">cm
      </div>
      <div class="input-group">
        높낮이: <input type="number" id="f-elevation" value="0">cm
      </div>
      <button class="btn" onclick="addCustomFurniture()">➕ 가구 추가</button>
    </div>

    <div class="divider"></div>

    <!-- 3. 조작 버튼 구역 -->
    <div class="panel-section">
      <button class="btn" onclick="rotateSelected()">🔄 90° 회전</button>
      <button class="btn btn-danger" onclick="deleteSelected()">🗑️ 삭제</button>
    </div>
  </div>

  <div id="status-bar">💡 메뉴바를 옆으로 스크롤할 수 있습니다. (가구 10cm 단위 이동)</div>
  <div id="canvas-container"></div>

  <script>
    // 1. Scene, Camera, Renderer 설정
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f5f7);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 5.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 2. 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 3. OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // 4. 동적 방 생성 관리
    let currentRoomWidth = 3.0; // 기본 3m (300cm)
    let currentRoomDepth = 3.0; // 기본 3m (300cm)
    let roomGroup = new THREE.Group();
    scene.add(roomGroup);

    function buildRoom(widthM, depthM) {
      // 기존 방 형태 제거
      while(roomGroup.children.length > 0){ 
        const obj = roomGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        roomGroup.remove(obj); 
      }

      currentRoomWidth = widthM;
      currentRoomDepth = depthM;

      // 바닥 그리드 (10cm = 0.1m 단위)
      const gridDivs = Math.max(Math.round(Math.max(widthM, depthM) * 10), 10);
      const grid = new THREE.GridHelper(Math.max(widthM, depthM), gridDivs, 0x888888, 0xe0e0e0);
      grid.position.y = 0.001;
      grid.scale.set(widthM / Math.max(widthM, depthM), 1, depthM / Math.max(widthM, depthM));
      roomGroup.add(grid);

      // 바닥
      const floorGeo = new THREE.PlaneGeometry(widthM, depthM);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xeaeaea });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      roomGroup.add(floor);

      // 뒷벽 및 문
      const wallHeight = 2.4;
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, side: THREE.DoubleSide });
      const doorWidth = 0.9;
      const doorHeight = 2.0;

      // 문 폭이 방 폭보다 크지 않도록 보정
      const actualDoorWidth = Math.min(doorWidth, widthM - 0.2);
      const wallSideWidth = (widthM - actualDoorWidth) / 2;

      // 뒷벽 (좌/우/상단)
      const wallBackLeft = new THREE.Mesh(new THREE.PlaneGeometry(wallSideWidth, wallHeight), wallMat);
      wallBackLeft.position.set(-widthM/2 + wallSideWidth/2, wallHeight/2, -depthM/2);
      roomGroup.add(wallBackLeft);

      const wallBackRight = new THREE.Mesh(new THREE.PlaneGeometry(wallSideWidth, wallHeight), wallMat);
      wallBackRight.position.set(widthM/2 - wallSideWidth/2, wallHeight/2, -depthM/2);
      roomGroup.add(wallBackRight);

      const wallBackTop = new THREE.Mesh(new THREE.PlaneGeometry(actualDoorWidth, wallHeight - doorHeight), wallMat);
      wallBackTop.position.set(0, doorHeight + (wallHeight - doorHeight)/2, -depthM/2);
      roomGroup.add(wallBackTop);

      // 🚪 문 및 손잡이
      const door = new THREE.Mesh(new THREE.PlaneGeometry(actualDoorWidth, doorHeight), new THREE.MeshStandardMaterial({ color: 0x8B5A2B, side: THREE.DoubleSide }));
      door.position.set(0, doorHeight / 2, -depthM / 2 + 0.005);
      roomGroup.add(door);

      const handle = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), new THREE.MeshStandardMaterial({ color: 0xFFD700 }));
      handle.position.set(actualDoorWidth * 0.35, 1.0, -depthM / 2 + 0.02);
      roomGroup.add(handle);

      // 왼쪽 벽
      const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(depthM, wallHeight), wallMat);
      wallLeft.position.set(-widthM/2, wallHeight/2, 0);
      wallLeft.rotation.y = Math.PI / 2;
      roomGroup.add(wallLeft);
    }

    // 초기 3m x 3m 방 생성
    buildRoom(3.0, 3.0);

    // 방 사이즈 변경 함수
    function updateRoomSize() {
      const rw = parseFloat(document.getElementById('r-width').value) || 300;
      const rd = parseFloat(document.getElementById('r-depth').value) || 300;

      if (rw < 100 || rd < 100) {
        alert('방 크기는 최소 100cm 이상 설정해 주세요.');
        return;
      }

      buildRoom(rw / 100, rd / 100);

      // 방 크기가 줄어들었을 때 기존 가구 위치 경계 보정
      furnitureList.forEach(obj => {
        const isRotated = Math.round(obj.rotation.y / (Math.PI / 2)) % 2 !== 0;
        const currentW = isRotated ? obj.userData.depth : obj.userData.width;
        const currentD = isRotated ? obj.userData.width : obj.userData.depth;

        const maxX = currentRoomWidth / 2 - currentW / 2;
        const maxZ = currentRoomDepth / 2 - currentD / 2;

        obj.position.x = Math.max(-maxX, Math.min(maxX, obj.position.x));
        obj.position.z = Math.max(-maxZ, Math.min(maxZ, obj.position.z));
      });
    }

    // 5. 파스텔 색상 및 가구 추가
    const colors = [0x4A90E2, 0x50E3C2, 0xF5A623, 0xB8E986, 0xBD10E0, 0x9013FE, 0xE67E22, 0x1ABC9C];
    let colorIndex = 0;
    const furnitureList = [];
    let selectedObject = null;

    function addCustomFurniture() {
      const name = document.getElementById('f-name').value || '가구';
      const wCm = parseFloat(document.getElementById('f-width').value) || 120;
      const dCm = parseFloat(document.getElementById('f-depth').value) || 60;
      const hCm = parseFloat(document.getElementById('f-height').value) || 75;
      const elevCm = parseFloat(document.getElementById('f-elevation').value) || 0;

      const w = wCm / 100;
      const d = dCm / 100;
      const h = hCm / 100;
      const elev = elevCm / 100;

      const group = new THREE.Group();

      const geometry = new THREE.BoxGeometry(w, h, d);
      const material = new THREE.MeshStandardMaterial({
        color: colors[colorIndex % colors.length],
        roughness: 0.3
      });
      colorIndex++;

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = elev + (h / 2);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      // 라벨
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 256, 128);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#333333';
      ctx.strokeRect(0, 0, 256, 128);
      ctx.fillStyle = '#000000';
      ctx.font = 'Bold 26px Noto Sans KR, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(name, 128, 45);
      ctx.font = '18px Noto Sans KR, sans-serif';
      ctx.fillText(`${wCm}x${dCm}x${hCm}cm`, 128, 80);
      if (elevCm > 0) {
        ctx.fillStyle = '#27ae60';
        ctx.fillText(`(높낮이: ${elevCm}cm)`, 128, 110);
      }

      const texture = new THREE.CanvasTexture(canvas);
      const labelMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      const labelGeo = new THREE.PlaneGeometry(Math.min(w, 1.2), Math.min(w, 1.2) * 0.5);
      const label = new THREE.Mesh(labelGeo, labelMat);
      label.position.set(0, elev + h + 0.01, 0);
      label.rotation.x = -Math.PI / 2;
      group.add(label);

      group.userData = { 
        name: name,
        mesh: mesh,
        width: w,
        depth: d,
        originalColor: material.color.getHex()
      };

      group.position.set(0, 0, 0);

      scene.add(group);
      furnitureList.push(group);
      selectObject(group);
    }

    // 6. 이동 & 경계 제한 (현재 방 크기에 동적 맞춤)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const planeIntersect = new THREE.Vector3();
    let isDragging = false;

    function updateMousePos(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
    }

    function onPointerDown(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('#ui-panel')) return;

      if (e.touches && e.touches.length > 1) {
        isDragging = false;
        controls.enabled = true;
        return;
      }

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      updateMousePos(clientX, clientY);

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(furnitureList, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== scene) {
          obj = obj.parent;
        }
        selectObject(obj);
        isDragging = true;
        controls.enabled = false;
      } else {
        deselectObject();
        controls.enabled = true;
      }
    }

    function onPointerMove(e) {
      if (!isDragging || !selectedObject) return;
      if (e.touches && e.touches.length > 1) return;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      updateMousePos(clientX, clientY);

      raycaster.setFromCamera(mouse, camera);
      if (raycaster.ray.intersectPlane(plane, planeIntersect)) {
        
        // 10cm 단위 스냅
        let targetX = Math.round(planeIntersect.x * 10) / 10;
        let targetZ = Math.round(planeIntersect.z * 10) / 10;

        const isRotated = Math.round(selectedObject.rotation.y / (Math.PI / 2)) % 2 !== 0;
        const currentW = isRotated ? selectedObject.userData.depth : selectedObject.userData.width;
        const currentD = isRotated ? selectedObject.userData.width : selectedObject.userData.depth;

        // 현재 설정된 방 크기 기준으로 가구 이동 경계 제한
        const minX = -currentRoomWidth / 2 + currentW / 2;
        const maxX = currentRoomWidth / 2 - currentW / 2;
        const minZ = -currentRoomDepth / 2 + currentD / 2;
        const maxZ = currentRoomDepth / 2 - currentD / 2;

        selectedObject.position.x = Math.max(minX, Math.min(maxX, targetX));
        selectedObject.position.z = Math.max(minZ, Math.min(maxZ, targetZ));
      }
    }

    function onPointerUp() {
      isDragging = false;
      controls.enabled = true;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // 7. 선택, 회전, 삭제
    function selectObject(obj) {
      deselectObject();
      selectedObject = obj;
      if (selectedObject && selectedObject.userData.mesh) {
        selectedObject.userData.mesh.material.color.setHex(0xFFD700);
        document.getElementById('status-bar').innerText = `선택됨: [${selectedObject.userData.name}] - 드래그하여 이동할 수 있습니다.`;
      }
    }

    function deselectObject() {
      if (selectedObject && selectedObject.userData.mesh) {
        selectedObject.userData.mesh.material.color.setHex(selectedObject.userData.originalColor);
        selectedObject = null;
        document.getElementById('status-bar').innerText = '💡 메뉴바를 옆으로 스크롤할 수 있습니다. (가구 10cm 단위 이동)';
      }
    }

    function rotateSelected() {
      if (selectedObject) {
        selectedObject.rotation.y += Math.PI / 2;
        const event = new MouseEvent('mousemove');
        onPointerMove(event);
      } else {
        alert('회전할 가구를 먼저 선택해 주세요.');
      }
    }

    function deleteSelected() {
      if (selectedObject) {
        scene.remove(selectedObject);
        const index = furnitureList.indexOf(selectedObject);
        if (index > -1) furnitureList.splice(index, 1);
        
        selectedObject.traverse((child) => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose());
            } else {
              child.material.dispose();
            }
          }
        });

        selectedObject = null;
        document.getElementById('status-bar').innerText = '삭제되었습니다.';
      } else {
        alert('삭제할 가구를 먼저 선택해 주세요.');
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 초기 가구 1개 배치
    addCustomFurniture();
  </script>
</body>
</html>
